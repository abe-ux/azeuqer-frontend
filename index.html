<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AZEUQER: TITANIUM</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #050505; --neon: #00ffcc; --pink: #ff00ff; --glass: rgba(255,255,255,0.05); }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; padding: 0; overflow: hidden; }
        .hidden { display: none !important; }
        .screen { padding: 20px; text-align: center; height: 100vh; width: 100vw; overflow-y: auto; box-sizing: border-box; position: relative; z-index: 10; }
        
        /* THE GAME CANVAS (Sits behind UI) */
        #phaser-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        canvas { display: block; width: 100%; height: 100%; }

        /* UI OVERLAYS (HTML on top of Canvas) */
        .ui-layer { position: relative; z-index: 20; }

        /* VISUAL JUICE */
        .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 50; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; }
        .glitch { font-size: 2rem; font-weight: bold; color: var(--neon); text-shadow: 2px 0 var(--pink); animation: shake 2s infinite; }
        @keyframes shake { 0% { transform: translate(0,0); } 2% { transform: translate(1px,0); } 4% { transform: translate(0,0); } }

        /* CONTROLS */
        .btn { width: 100%; padding: 15px; background: #111; border: 1px solid var(--neon); color: var(--neon); margin-top: 15px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.1s; }
        .btn:active { background: var(--neon); color: #000; transform: scale(0.98); }
        .btn-red { border-color: var(--pink); color: var(--pink); }
        .btn-sheesh { border-color: #00ff00; color: #00ff00; box-shadow: 0 0 15px rgba(0,255,0,0.2); }

        /* CARDS */
        .card { width: 100%; max-width: 350px; height: 450px; margin: 0 auto; border: 1px solid #333; position: relative; background: #000; transition: transform 0.2s; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-overlay { position: absolute; bottom: 0; width: 100%; background: linear-gradient(to top, #000, transparent); padding: 20px; box-sizing: border-box; text-align: left; }
        
        /* STAMPS */
        .stamp-overlay { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.8); border: 1px solid var(--neon); color: var(--neon); padding: 5px; font-size: 0.7rem; transform: rotate(-10deg); box-shadow: 0 0 10px var(--neon); }

        /* LOADER */
        #loader { position: fixed; inset: 0; background: #000; z-index: 100; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div id="loader" class="hidden"><div class="glitch">CONNECTING...</div></div>

    <div id="phaser-container"></div>

    <div id="screen-entry" class="screen ui-layer">
        <h1 class="glitch" style="margin-top:50px;">AZEUQER</h1>
        <p style="color:#888;">// REALITY EXTRACTION</p>
        <div style="border: 1px dashed #333; padding: 40px; margin: 20px;">
            <label class="btn">
                📸 SCAN FACE
                <input type="file" id="cam" accept="image/*" class="hidden" onchange="uploadBio()">
            </label>
        </div>
        <div id="status-log" style="margin-top:20px; color:#555; font-size: 0.8rem;">SYSTEM READY</div>
    </div>

    <div id="screen-feed" class="screen hidden ui-layer">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span style="color:var(--neon); font-weight:bold;">AP: <span id="hud-ap">0</span></span>
            <button onclick="loadProfile()" style="background:none; border:1px solid #333; color:#fff; padding:5px 10px;">👤 ME</button>
        </div>
        <div id="feed-container"><div style="margin-top:100px;">NO SIGNALS...</div></div>
        <div style="display:flex; gap:15px; position:fixed; bottom:30px; width:90%; left:5%;">
            <button class="btn btn-red" onclick="swipe('SPITE')"> 💀 SPITE</button>
            <button class="btn btn-sheesh" onclick="swipe('LIGHT')"> 🔥 SHEESH</button>
        </div>
    </div>

    <div id="screen-profile" class="screen hidden ui-layer">
        <h2 class="glitch" style="margin-bottom:20px;">PASSPORT</h2>
        <div style="position:relative; width:150px; height:150px; margin: 0 auto;">
            <img id="prof-img" src="" style="width:100%; height:100%; border:2px solid var(--neon); object-fit:cover;">
            <div id="prof-stamp" class="stamp-overlay hidden">VOID TOKEN</div>
        </div>
        <h2 id="prof-name" style="margin:10px 0; color:#fff;">AGENT</h2>
        <div id="prof-faction" style="color:var(--pink); margin-bottom:20px;">NEUTRAL</div>
        <h3 style="border-bottom:1px solid #333; padding-bottom:5px; text-align:left;">INVENTORY</h3>
        <div id="inventory-list" style="text-align:left; max-height: 30vh; overflow-y:auto;"></div>
        <button class="btn" onclick="showScreen('screen-feed')">BACK TO FEED</button>
    </div>

    <div id="screen-combat" class="screen hidden ui-layer" style="background: transparent;">
        <h1 class="glitch" style="color:var(--pink); margin-top:20px;">AMBUSH</h1>
        
        <div style="margin-top: 300px;"></div> <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn btn-red" onclick="gameCombatAction('ATTACK')">⚔ ATTACK</button>
            <button class="btn" style="border-color:#fff; color:#fff;" onclick="gameCombatAction('POTION_HP')">💉 HEAL</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_URL = "https://azeuqer-backend.onrender.com"; // UPDATE THIS !!!
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- PHASER GAME ENGINE (THE VISUAL CORE) ---
        let game;
        let combatScene;

        class CombatScene extends Phaser.Scene {
            constructor() { super({ key: 'CombatScene' }); }

            preload() {
                // Generative Graphics (No external files needed)
                const graphics = this.make.graphics({ x: 0, y: 0, add: false });
                
                // 1. Draw Boss (Red Demon)
                graphics.fillStyle(0xff0000, 1);
                graphics.fillRect(0, 0, 200, 200); // Body
                graphics.fillStyle(0xffff00, 1);
                graphics.fillCircle(50, 50, 20); // Eye L
                graphics.fillCircle(150, 50, 20); // Eye R
                graphics.generateTexture('boss', 200, 200);
                
                // 2. Draw Particle (Spark)
                graphics.clear();
                graphics.fillStyle(0xffffff, 1);
                graphics.fillCircle(5, 5, 5);
                graphics.generateTexture('spark', 10, 10);
            }

            create() {
                this.cameras.main.setBackgroundColor('rgba(0,0,0,0)'); // Transparent
                
                // Boss Sprite
                this.boss = this.add.sprite(this.scale.width / 2, 250, 'boss');
                this.boss.setAlpha(0); // Hide until combat starts

                // Breathing Animation (Tween)
                this.tweens.add({
                    targets: this.boss,
                    scaleY: 1.05,
                    scaleX: 0.98,
                    y: 255,
                    duration: 1500,
                    yoyo: true,
                    repeat: -1,
                    ease: 'Sine.easeInOut'
                });

                // Particle System (Explosion)
                this.particles = this.add.particles(0, 0, 'spark', {
                    speed: { min: 100, max: 300 },
                    angle: { min: 0, max: 360 },
                    scale: { start: 1, end: 0 },
                    lifespan: 500,
                    gravityY: 500,
                    quantity: 20,
                    emitting: false
                });
            }

            startCombat(bossName, hp) {
                this.boss.setAlpha(1);
                this.boss.y = -200; // Fly in from top
                this.tweens.add({
                    targets: this.boss,
                    y: 250,
                    duration: 800,
                    ease: 'Bounce.easeOut'
                });
                // Add Health Bar Text
                if(this.hpText) this.hpText.destroy();
                this.hpText = this.add.text(this.scale.width/2, 120, `HP: ${hp}`, {
                    fontSize: '24px', fontFamily: 'Courier', color: '#ff0000', fontStyle: 'bold'
                }).setOrigin(0.5);
            }

            takeDamage(amount) {
                // 1. Shake Camera
                this.cameras.main.shake(200, 0.02);
                
                // 2. Flash Boss
                this.boss.setTint(0xff0000);
                this.time.delayedCall(100, () => this.boss.clearTint());

                // 3. Spawn Particles
                this.particles.emitParticleAt(this.boss.x, this.boss.y);

                // 4. Floating Damage Text
                const dmgText = this.add.text(this.boss.x, this.boss.y, `-${amount}`, {
                    fontSize: '40px', color: '#fff', stroke: '#ff0000', strokeThickness: 4
                }).setOrigin(0.5);

                this.tweens.add({
                    targets: dmgText,
                    y: this.boss.y - 100,
                    alpha: 0,
                    duration: 1000,
                    onComplete: () => dmgText.destroy()
                });
            }

            updateHP(val) {
                this.hpText.setText(`HP: ${val}`);
            }

            victory() {
                // Boss Dies
                this.tweens.add({
                    targets: this.boss,
                    scale: 0,
                    rotation: 10,
                    duration: 500,
                    onComplete: () => this.boss.setAlpha(0)
                });
                this.particles.emitParticleAt(this.boss.x, this.boss.y, 50); // Big explosion
            }
        }

        // Initialize Phaser
        const config = {
            type: Phaser.AUTO,
            parent: 'phaser-container',
            width: window.innerWidth,
            height: window.innerHeight,
            transparent: true,
            scene: [CombatScene]
        };
        game = new Phaser.Game(config);

        // --- APP LOGIC (CONNECTING PHASER TO PYTHON) ---
        let feed = [];
        let currentBossHP = 0;

        async function init() {
            showLoader(true);
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: "POST", headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ initData: tg.initData || "debug_mode" })
                });
                const data = await res.json();
                if (data.user.bio_lock_url) {
                    document.getElementById('hud-ap').innerText = data.user.ap;
                    showScreen('screen-feed');
                    loadFeed();
                    if (data.user.combat_state === "LOCKED") triggerAmbush();
                } else {
                    showScreen('screen-entry');
                }
            } catch(e) { alert("SERVER ERROR: " + e.message); }
            showLoader(false);
        }

        async function uploadBio() {
            // ... (Same upload logic as before) ...
            // Simplified for brevity in this step, paste the working uploadBio from v7.2 here if needed
            // For now, let's assume the previous working logic is preserved.
            const file = document.getElementById('cam').files[0];
            if (!file) return;
            showLoader(true);
            const fd = new FormData();
            fd.append("initData", tg.initData || "debug_mode");
            fd.append("file", file);
            try {
                const res = await fetch(`${API_URL}/auth/biolock`, { method: "POST", body: fd });
                const data = await res.json();
                if (data.status === "success") location.reload();
            } catch(e) { alert("UPLOAD ERROR"); }
            showLoader(false);
        }

        // --- COMBAT BRIDGES ---
        function triggerAmbush() {
            showScreen('screen-combat');
            loadCombatInfo();
        }

        async function loadCombatInfo() {
            const res = await fetch(`${API_URL}/game/combat/info`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ initData: tg.initData || "debug_mode" })
            });
            const data = await res.json();
            currentBossHP = data.boss.hp;
            
            // WAKE UP PHASER
            const scene = game.scene.getScene('CombatScene');
            scene.startCombat(data.boss.name, currentBossHP);
        }

        async function gameCombatAction(action) {
            // 1. Call Backend
            const res = await fetch(`${API_URL}/game/combat/turn`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ initData: tg.initData || "debug_mode", action: action, boss_hp_current: currentBossHP })
            });
            const data = await res.json();
            
            // 2. Trigger Phaser FX
            const scene = game.scene.getScene('CombatScene');
            
            if (action === 'ATTACK') {
                const dmg = currentBossHP - data.new_boss_hp;
                if (dmg > 0) scene.takeDamage(dmg);
            }

            if (data.status === "VICTORY") {
                scene.victory();
                setTimeout(() => {
                    alert(`VICTORY! LOOT: ${data.loot}`);
                    location.reload();
                }, 1500);
            } else {
                currentBossHP = data.new_boss_hp;
                scene.updateHP(currentBossHP);
            }
        }

        // --- STANDARD UTILS ---
        async function loadFeed() { /* ... Same feed logic ... */ 
             const res = await fetch(`${API_URL}/game/feed`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ initData: tg.initData || "debug_mode" })
            });
            const data = await res.json();
            feed = data.feed;
            renderCard();
        }
        function renderCard() {
             const container = document.getElementById('feed-container');
            if (feed.length === 0) { container.innerHTML = "<div style='margin-top:100px'>NO TARGETS</div>"; return; }
            const u = feed[0];
            const stampHtml = u.equipped_item ? `<div class="stamp-overlay">${u.equipped_item}</div>` : '';
            container.innerHTML = `
                <div class="card">
                    <img src="${u.bio_lock_url}">
                    ${stampHtml}
                    <div class="card-overlay">
                        <h2 style="margin:0;">${u.username}</h2>
                        <div style="color:var(--neon)">${u.faction || 'NEUTRAL'}</div>
                    </div>
                </div>`;
        }
        async function swipe(dir) {
             if (feed.length === 0) return;
            const target = feed[0];
            document.querySelector('.card').style.transform = dir === 'LIGHT' ? 'translateX(200px) rotate(20deg)' : 'translateX(-200px) rotate(-20deg)';
            const res = await fetch(`${API_URL}/game/swipe`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ initData: tg.initData || "debug_mode", target_id: target.user_id, direction: dir })
            });
            const data = await res.json();
            document.getElementById('hud-ap').innerText = (parseInt(document.getElementById('hud-ap').innerText) + 1);
            if (data.status === "AMBUSH") { triggerAmbush(); }
            else { feed.shift(); setTimeout(() => renderCard(), 200); }
        }
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            // Hide/Show Phaser based on screen
            if (id === 'screen-combat') {
                document.getElementById('phaser-container').style.display = 'block';
            } else {
                document.getElementById('phaser-container').style.display = 'none';
            }
        }
        function showLoader(v) { v ? document.getElementById('loader').classList.remove('hidden') : document.getElementById('loader').classList.add('hidden'); }
        async function loadProfile() {
             showLoader(true);
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: "POST", headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({ initData: tg.initData || "debug_mode" })
                });
                const data = await res.json();
                const u = data.user;
                document.getElementById('prof-img').src = u.bio_lock_url;
                document.getElementById('prof-name').innerText = u.username;
                document.getElementById('prof-faction').innerText = u.faction || "UNSORTED";
                const stampEl = document.getElementById('prof-stamp');
                if(u.equipped_item) {
                    stampEl.innerText = u.equipped_item;
                    stampEl.classList.remove('hidden');
                } else {
                    stampEl.classList.add('hidden');
                }
                const invRes = await fetch(`${API_URL}/game/inventory`, {
                     method: "POST", headers: {"Content-Type":"application/json"},
                     body: JSON.stringify({ initData: tg.initData || "debug_mode" })
                });
                const invData = await invRes.json();
                const list = document.getElementById('inventory-list');
                list.innerHTML = "";
                invData.items.forEach(i => {
                    list.innerHTML += `<div class="inv-item" style="border:1px solid #333; padding:10px; margin:5px;"><span>${i.item_id}</span><button onclick="equip('${i.item_id}')">EQUIP</button></div>`;
                });
                showScreen('screen-profile');
            } catch(e) { alert("ERROR"); }
            showLoader(false);
        }
        async function equip(id) {
             await fetch(`${API_URL}/game/equip`, {
                method: "POST", headers: {"Content-Type":"application/json"},
                body: JSON.stringify({ initData: tg.initData || "debug_mode", item_id: id })
            });
            alert("EQUIPPED"); loadProfile();
        }

        init();
    </script>
</body>
</html>
