<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>AZEUQER: TITANIUM — PROMPT 1.4 VESSEL</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root{ --bg:#050505; --panel:rgba(0,0,0,0.85); --neon:#00ffcc; --pink:#ff00ff; --red:#ff3333; --muted:#777; }
  body{background:var(--bg);color:#fff;font-family:'Courier New',monospace;margin:0;overflow:hidden;}
  .hidden{display:none!important;}
  .scanlines{position:fixed;inset:0;pointer-events:none;z-index:50;background:linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));background-size:100% 2px, 3px 100%;}
  #ui-layer{position:fixed;inset:0;z-index:10;pointer-events:none;}
  .screen{pointer-events:auto;padding:20px;text-align:center;height:100vh;overflow-y:auto;box-sizing:border-box;background:var(--panel);}
  .glitch{animation:shake 2s infinite;color:var(--neon);font-size:2rem;font-weight:bold;text-shadow:2px 0 var(--pink);}
  @keyframes shake{0%{transform:translate(0,0);}2%{transform:translate(1px,0);}4%{transform:translate(0,0);}}
  .pioneer-glitch{color:#fff;text-shadow:0 0 6px var(--neon),0 0 12px var(--pink),0 0 20px var(--neon);animation:pglow 1.4s infinite alternate;}
  @keyframes pglow{from{filter:brightness(1);}to{filter:brightness(1.35);} }
  .card{width:380px;max-width:96%;margin:14px auto;padding:14px;border:1px solid #333;background:rgba(255,255,255,0.03);border-radius:12px;text-align:left;}
  .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .tag{display:inline-block;padding:6px 10px;border:1px solid #333;border-radius:999px;color:#bbb;font-size:0.75rem;}
  .tag.neon{border-color:var(--neon);color:var(--neon);}
  .tag.pink{border-color:var(--pink);color:var(--pink);}
  .tag.red{border-color:var(--red);color:var(--red);}
  .small{font-size:0.82rem;color:#bbb;line-height:1.25rem;}
  .muted{color:var(--muted);}
  .divider{height:1px;background:#222;margin:14px 0;}
  .btn{width:100%;padding:14px;background:#111;border:1px solid var(--neon);color:var(--neon);margin-top:12px;font-weight:bold;cursor:pointer;pointer-events:auto;border-radius:10px;}
  .btn:active{transform:scale(0.99);background:var(--neon);color:#000;}
  .btn-red{border-color:var(--red);color:var(--red);}
  .btn-red:active{background:var(--red);color:#000;}
  .btn-small{width:auto;padding:8px 10px;font-size:0.8rem;margin-top:0;border-radius:10px;}
  .camera-label{display:block;width:100%;padding:18px;margin-top:12px;background:rgba(17,17,17,0.9);border:2px dashed var(--neon);color:var(--neon);font-size:1.05rem;font-weight:bold;cursor:pointer;text-transform:uppercase;border-radius:12px;}
  video{width:100%;border:2px solid var(--neon);margin-top:12px;border-radius:12px;background:#000;}
  #loader{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;}
  .avatar{width:120px;height:120px;margin:0 auto;border:2px solid var(--neon);border-radius:14px;overflow:hidden;background:#000;position:relative;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  .badge{position:absolute;bottom:-10px;right:-10px;background:#000;border:1px solid var(--neon);color:var(--neon);padding:6px 8px;font-size:0.7rem;font-weight:bold;border-radius:10px;}
  .slider-wrap{margin-top:10px;}
  .slider{width:100%;accent-color:var(--neon);}
  .slider-label{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:#bbb;}
  .slider-label b{color:#fff;}
  .preview-box{width:340px;max-width:96%;margin:0 auto;border:1px solid #333;border-radius:12px;overflow:hidden;background:#000;}
  canvas{display:block;width:100%;height:auto;}
</style>
</head>

<body>
<div class="scanlines"></div>

<div id="loader" class="hidden">
  <div class="glitch">CONNECTING...</div>
  <div id="loader-msg" style="color:#666;font-size:0.85rem;margin-top:10px;"></div>
</div>

<div id="ui-layer">
  <div id="screen-entry" class="screen">
    <h1 id="title" class="glitch" style="margin-top:24px;">AZEUQER</h1>
    <p class="muted" style="margin:6px 0 0;">// PROMPT 1.4: VESSEL</p>

    <div class="card">
      <div class="row">
        <span class="tag neon">IDENTITY</span>
        <span id="role-tag" class="tag">CITIZEN</span>
        <span id="verif-tag" class="tag">PENDING</span>
      </div>
      <div class="divider"></div>

      <div class="avatar">
        <img id="me-img" src="" alt="me" />
        <div id="pioneer-badge" class="badge hidden">PIONEER</div>
      </div>

      <h2 id="me-name" style="margin:12px 0 0;">AGENT</h2>
      <div class="small muted">User ID: <span id="me-id">—</span></div>
      <div class="small muted">AP: <span id="me-ap">0</span></div>
      <div class="small muted">BioLock: <span id="me-biolock">GATE</span></div>
      <div class="small muted">Body Asset: <span id="me-body">body_mid_mid_mid_mid.png</span></div>
    </div>

    <div class="card">
      <div class="row">
        <span class="tag pink">VESSEL</span>
        <span id="vessel-band" class="tag">MID</span>
      </div>
      <div class="divider"></div>

      <div class="slider-wrap">
        <div class="slider-label"><span>WORK</span><b id="workVal">50</b></div>
        <input id="work" class="slider" type="range" min="0" max="100" value="50" />
        <div class="slider-label"><span>PACE</span><b id="paceVal">50</b></div>
        <input id="pace" class="slider" type="range" min="0" max="100" value="50" />
        <div class="slider-label"><span>MIND</span><b id="mindVal">50</b></div>
        <input id="mind" class="slider" type="range" min="0" max="100" value="50" />
        <div class="slider-label"><span>VIBE</span><b id="vibeVal">50</b></div>
        <input id="vibe" class="slider" type="range" min="0" max="100" value="50" />
      </div>

      <button class="btn" onclick="saveVessel()">SAVE VESSEL</button>
      <div id="vessel-msg" class="small muted" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <div class="row">
        <span class="tag neon">PREVIEW</span>
        <span class="tag muted">Face riding vehicle</span>
      </div>
      <div class="divider"></div>
      <div class="preview-box">
        <canvas id="preview" width="900" height="600"></canvas>
      </div>
    </div>

    <div id="status-log" class="small muted" style="margin-top:14px;">SYSTEM READY</div>
  </div>
</div>

<script>
const API_URL = "https://azeuqer-backend.onrender.com";
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
try { if (tg) { tg.ready(); tg.expand(); } } catch (e) {}

let ME = null;

function showLoader(v, msg=""){
  const l = document.getElementById("loader");
  if (v){ l.classList.remove("hidden"); document.getElementById("loader-msg").innerText = msg; }
  else { l.classList.add("hidden"); }
}
function logStatus(msg){ document.getElementById("status-log").textContent = msg; }
function setTag(el, text, kind=null){
  el.classList.remove("neon","pink","red");
  if (kind) el.classList.add(kind);
  el.textContent = text;
}

function band(v){
  if(v<=33) return "LOW";
  if(v<=66) return "MID";
  return "HIGH";
}
function bodyAsset(work,pace,mind,vibe){
  const b=(x)=> (x<=33?"low":(x<=66?"mid":"high"));
  return `body_${b(work)}_${b(pace)}_${b(mind)}_${b(vibe)}.png`;
}

function hookSliders(){
  const ids=["work","pace","mind","vibe"];
  ids.forEach(id=>{
    document.getElementById(id).addEventListener("input", ()=>{
      document.getElementById(id+"Val").textContent = document.getElementById(id).value;
      updateVesselLabel();
      drawPreview();
    });
  });
}

function updateVesselLabel(){
  const w=+document.getElementById("work").value;
  const p=+document.getElementById("pace").value;
  const m=+document.getElementById("mind").value;
  const v=+document.getElementById("vibe").value;
  const avg=Math.round((w+p+m+v)/4);
  document.getElementById("vessel-band").textContent = band(avg);
  document.getElementById("me-body").textContent = bodyAsset(w,p,m,v);
}

function hashHue(seed){
  let h=7;
  for(const ch of seed) h=(h*31 + ch.charCodeAt(0))>>>0;
  return h%360;
}

async function loadImage(url){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin="anonymous";
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error("IMG_FAIL"));
    img.src=url;
  });
}

async function drawPreview(){
  const canvas=document.getElementById("preview");
  const ctx=canvas.getContext("2d");

  const w=+document.getElementById("work").value;
  const p=+document.getElementById("pace").value;
  const m=+document.getElementById("mind").value;
  const v=+document.getElementById("vibe").value;

  const asset = bodyAsset(w,p,m,v);
  const hue = hashHue(asset);

  // bg
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const grad=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
  grad.addColorStop(0, `hsl(${hue} 70% 8%)`);
  grad.addColorStop(1, `hsl(${(hue+160)%360} 70% 10%)`);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // aura
  const rg=ctx.createRadialGradient(canvas.width*0.5, canvas.height*0.35, 20, canvas.width*0.5, canvas.height*0.35, 420);
  rg.addColorStop(0, `hsla(${(hue+260)%360} 90% 70% / 0.35)`);
  rg.addColorStop(1, `hsla(${(hue+260)%360} 90% 70% / 0)`);
  ctx.fillStyle=rg;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // "vehicle" (procedural hoverboard/cloud)
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height*0.74);
  ctx.shadowColor=`hsla(${(hue+180)%360} 90% 60% / 0.7)`;
  ctx.shadowBlur=35;
  ctx.fillStyle=`hsla(${(hue+180)%360} 90% 55% / 0.18)`;
  ctx.strokeStyle=`hsla(${(hue+180)%360} 90% 65% / 0.75)`;
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.moveTo(-260, 0);
  ctx.bezierCurveTo(-180,-70,-40,-70,0,-25);
  ctx.bezierCurveTo(40,20,190,20,260,-10);
  ctx.bezierCurveTo(270,40,200,80,90,70);
  ctx.bezierCurveTo(-20,60,-160,80,-250,40);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();

  // ground shadow
  ctx.fillStyle="rgba(0,0,0,0.55)";
  ctx.beginPath();
  ctx.ellipse(canvas.width/2, canvas.height*0.90, 280, 50, 0, 0, Math.PI*2);
  ctx.fill();

  // face (circle) if available
  const faceUrl = ME && ME.bio_lock_url ? ME.bio_lock_url : null;
  if(faceUrl){
    try{
      const img = await loadImage(faceUrl);
      const cx=canvas.width/2, cy=canvas.height*0.38, r=160;

      // crop circle
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(img, cx-r, cy-r, r*2, r*2);
      ctx.restore();

      // ring glow
      ctx.strokeStyle=`hsla(${(hue+180)%360} 90% 65% / 0.95)`;
      ctx.lineWidth=10;
      ctx.shadowColor=`hsla(${(hue+180)%360} 90% 65% / 0.8)`;
      ctx.shadowBlur=25;
      ctx.beginPath(); ctx.arc(cx,cy,r+8,0,Math.PI*2); ctx.stroke();
      ctx.shadowBlur=0;

    }catch(e){
      // ignore preview errors
    }
  } else {
    ctx.fillStyle="rgba(255,255,255,0.08)";
    ctx.font="28px Courier New, monospace";
    ctx.textAlign="center";
    ctx.fillText("Scan Face to preview your Rider", canvas.width/2, canvas.height*0.40);
  }

  // label
  ctx.fillStyle="rgba(255,255,255,0.65)";
  ctx.font="22px Courier New, monospace";
  ctx.textAlign="left";
  ctx.fillText(asset, 24, 40);
}

async function saveVessel(){
  const work=+document.getElementById("work").value;
  const pace=+document.getElementById("pace").value;
  const mind=+document.getElementById("mind").value;
  const vibe=+document.getElementById("vibe").value;

  const initData = (tg && tg.initData) ? tg.initData : "debug_mode";
  showLoader(true,"SAVING VESSEL...");
  try{
    const res = await fetch(`${API_URL}/profile/vessel`,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({initData, work, pace, mind, vibe})
    });
    const data = await res.json();
    if(data.status!=="ok") throw new Error(data.msg||"SAVE_FAIL");
    ME = data.user;
    document.getElementById("vessel-msg").textContent = "Saved.";
    document.getElementById("me-body").textContent = ME.body_asset_id || bodyAsset(work,pace,mind,vibe);
    drawPreview();
  }catch(e){
    document.getElementById("vessel-msg").textContent = "Save failed: "+(e.message||e);
  }finally{
    showLoader(false);
  }
}

async function init(){
  showLoader(true,"CONNECTING...");
  try{
    const initData = (tg && tg.initData) ? tg.initData : "debug_mode";
    const start_param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) ? tg.initDataUnsafe.start_param : "";
    const res = await fetch(`${API_URL}/auth/login`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({initData, start_param})
    });
    const data = await res.json();
    if(data.status!=="ok" || !data.user) throw new Error(data.msg||"LOGIN_FAIL");
    ME=data.user;

    // identity
    document.getElementById("me-id").textContent = ME.user_id ?? ME.tg_id ?? "—";
    document.getElementById("me-name").textContent = ME.username || "AGENT";
    document.getElementById("me-ap").textContent = ME.ap ?? 0;
    document.getElementById("me-biolock").textContent = ME.biolock_status || "GATE";
    document.getElementById("me-img").src = ME.bio_lock_url || "";

    const pioneer = (ME.role==="PIONEER");
    document.getElementById("pioneer-badge").classList.toggle("hidden", !pioneer);
    document.getElementById("title").classList.toggle("pioneer-glitch", pioneer);

    setTag(document.getElementById("role-tag"), (ME.role||"CITIZEN"), pioneer?"neon":null);
    setTag(document.getElementById("verif-tag"), (ME.verification_status||"PENDING"),
      (ME.verification_status==="VERIFIED"?"neon":(ME.verification_status==="REJECTED"?"red":"pink"))
    );

    // preload sliders from DB if present
    const w = (ME.vessel_work ?? 50);
    const p = (ME.vessel_pace ?? 50);
    const m = (ME.vessel_mind ?? 50);
    const v = (ME.vessel_vibe ?? 50);

    document.getElementById("work").value = w; document.getElementById("workVal").textContent = w;
    document.getElementById("pace").value = p; document.getElementById("paceVal").textContent = p;
    document.getElementById("mind").value = m; document.getElementById("mindVal").textContent = m;
    document.getElementById("vibe").value = v; document.getElementById("vibeVal").textContent = v;

    updateVesselLabel();
    await drawPreview();

    logStatus("CONNECTED.");
  }catch(e){
    logStatus("BACKEND ERROR.");
  }finally{
    showLoader(false);
  }
}

hookSliders();
init();
</script>
</body>
</html>
