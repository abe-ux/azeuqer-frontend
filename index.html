<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>AZEUQER: TITANIUM 13.2 (Profile + Inventory + Combat)</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root { --bg:#050505; --neon:#00ffcc; --pink:#ff00ff; --red:#ff3333; }
  body { background:var(--bg); color:#fff; font-family:'Courier New', monospace; margin:0; overflow:hidden; }
  .hidden{display:none!important;}

  /* LAYERS */
  #game-layer { position:fixed; inset:0; z-index:1; }
  #ui-layer { position:fixed; inset:0; z-index:10; pointer-events:none; }

  /* SCREENS */
  .screen {
    pointer-events:auto; padding:20px; text-align:center;
    height:100vh; overflow-y:auto; box-sizing:border-box;
    background:rgba(0,0,0,0.85);
    transition: opacity 0.3s;
  }
  .screen.transparent { background:none; }

  /* JUICE & GLITCH */
  .scanlines {
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background:
      linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
      linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
    background-size:100% 2px, 3px 100%;
  }
  .glitch { animation:shake 2s infinite; color:var(--neon); font-size:2rem; font-weight:bold; text-shadow: 2px 0 var(--pink); }
  @keyframes shake{0%{transform:translate(0,0);}2%{transform:translate(1px,0);}4%{transform:translate(0,0);} }

  /* CONTROLS */
  .camera-label{
    display:block; width:100%; padding:30px; margin-top:40px;
    background:rgba(17,17,17,0.9); border:2px dashed var(--neon);
    color:var(--neon); font-size:1.2rem; font-weight:bold; cursor:pointer;
    text-transform:uppercase;
  }
  .btn{
    width:100%; padding:15px; background:#111;
    border:1px solid var(--neon); color:var(--neon);
    margin-top:15px; font-weight:bold; cursor:pointer;
    pointer-events:auto;
  }
  .btn:active{ transform:scale(0.98); background:var(--neon); color:#000; }
  .btn-red{ border-color:var(--red); color:var(--red); }
  .btn-red:active{ background:var(--red); color:#000; }
  .btn-small{ width:auto; font-size:0.8rem; padding:5px 10px; margin:0; }

  /* CARD & PROFILE */
  .card{ width:300px; height:400px; margin:20px auto; border:1px solid #333; position:relative; background:#000; overflow:hidden; }
  .card img{ width:100%; height:100%; object-fit:cover; }
  .card-overlay{
    position:absolute; bottom:0; width:100%;
    background:linear-gradient(to top, #000, transparent);
    padding:20px; box-sizing:border-box; text-align:left;
  }

  /* INVENTORY GRID */
  .inv-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:20px; }
  .inv-item { border:1px solid #333; padding:10px; font-size:0.7rem; background:rgba(255,255,255,0.05); cursor:pointer; user-select:none; }
  .inv-item.equipped { border-color:var(--neon); box-shadow:0 0 10px var(--neon); }

  /* VIDEO & LOADER */
  video{ width:100%; border:2px solid var(--neon); margin-top:20px; }
  #loader{ position:fixed; inset:0; background:#000; z-index:100; display:flex; align-items:center; justify-content:center; flex-direction:column; }
</style>
</head>

<body>
<div class="scanlines"></div>

<div id="loader" class="hidden">
  <div class="glitch">CONNECTING...</div>
  <div id="loader-msg" style="color:#666;font-size:0.8rem;margin-top:10px;"></div>
</div>

<div id="game-layer"></div>

<div id="ui-layer">

  <!-- ENTRY -->
  <div id="screen-entry" class="screen">
    <h1 class="glitch" style="margin-top:50px;">AZEUQER</h1>
    <p style="color:#888;">// GAMIFIED PROTOCOL v13.2</p>

    <button class="camera-label" onclick="openCamera()">📸 SCAN FACE</button>

    <div id="camera-box" class="hidden">
      <video id="video" autoplay playsinline muted></video>
      <button class="btn" onclick="capturePhoto()">📸 CAPTURE</button>
      <button class="btn btn-red" onclick="stopCamera()">✖ CLOSE</button>
      <small id="cam-debug" style="display:block; margin-top:5px; color:#555;"></small>
    </div>

    <input id="cameraFallback" class="hidden" type="file" accept="image/*" capture="user" />
    <canvas id="canvas" class="hidden"></canvas>
    <div id="status-log" style="margin-top:20px;color:#555;">SYSTEM READY</div>
  </div>

  <!-- FEED -->
  <div id="screen-feed" class="screen hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; width:100%; padding-bottom:10px; border-bottom:1px solid #333;">
      <span style="color:var(--neon); font-weight:bold; font-size:1.2rem;">AP: <span id="hud-ap">0</span></span>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-small" onclick="loadProfile()">👤 ME</button>
        <button class="btn btn-red btn-small" onclick="nukeIdentity()">⚠ RESET</button>
      </div>
    </div>

    <div id="feed-container"></div>

    <div style="position:fixed; bottom:30px; width:90%; left:5%; display:flex; gap:15px;">
      <button class="btn btn-red" onclick="swipe('SPITE')">💀 SPITE</button>
      <button class="btn" onclick="swipe('LIGHT')">⚡ LIGHT</button>
    </div>
  </div>

  <!-- PROFILE -->
  <div id="screen-profile" class="screen hidden">
    <h2 class="glitch" style="margin-bottom:20px;">PASSPORT</h2>

    <div style="width:150px; height:150px; margin:0 auto; border:2px solid var(--neon); padding:5px; position:relative;">
      <img id="prof-img" src="" alt="profile" style="width:100%; height:100%; object-fit:cover;">
      <div id="prof-badge" style="position:absolute; bottom:-10px; right:-10px; background:#000; border:1px solid var(--neon); color:var(--neon); padding:5px; font-size:0.7rem; font-weight:bold;" class="hidden">ITEM</div>
    </div>

    <h2 id="prof-name" style="margin-top:20px;">AGENT</h2>
    <div id="prof-faction" style="color:var(--pink); margin-bottom:20px;">NEUTRAL</div>

    <div style="text-align:left; border-top:1px solid #333; padding-top:10px;">
      <h3 style="margin:0; color:#888;">INVENTORY</h3>
      <div id="inventory-list" class="inv-grid"></div>
    </div>

    <button class="btn" onclick="showScreen('screen-feed')">BACK TO FEED</button>
  </div>

  <!-- COMBAT -->
  <div id="screen-combat" class="screen hidden transparent">
    <h1 class="glitch" style="color:var(--red); margin-top:20px;">AMBUSH</h1>
    <div style="margin-top:350px;"></div>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn btn-red" onclick="gameCombatAction('ATTACK')">⚔ ATTACK</button>
      <button class="btn" style="border-color:#fff; color:#fff;" onclick="gameCombatAction('POTION_HP')">💉 HEAL</button>
    </div>
    <button class="btn btn-small" style="margin-top:12px;border-color:#777;color:#777;" onclick="exitCombat()">↩ BACK</button>
  </div>

</div>

<script>
/** ======================
 * CONFIG
 * ====================== */
const API_URL = "https://azeuqer-backend.onrender.com"; // ✅ correct (no extra quote)

const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
try { if (tg) { tg.ready(); tg.expand(); } } catch(e) {}

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isTelegram = !!tg;

let cameraStream = null;
let feed = [];
let currentBossHP = 0;

/** ======================
 * PHASER ENGINE
 * ====================== */
let game;

class CombatScene extends Phaser.Scene {
  constructor(){ super({ key:'Combat' }); }

  preload(){
    const g = this.make.graphics({x:0,y:0,add:false});
    g.fillStyle(0xff0000, 1); g.fillRect(0,0,160,160);
    g.fillStyle(0x000000, 1); g.fillRect(30,40,30,30); g.fillRect(100,40,30,30);
    g.generateTexture('boss', 160, 160);

    g.clear(); g.fillStyle(0xffffff, 1); g.fillCircle(4,4,4);
    g.generateTexture('spark', 8, 8);
  }

  create(){
    this.cameras.main.setBackgroundColor('rgba(0,0,0,0)');
    this.boss = this.add.sprite(this.scale.width/2, 300, 'boss').setAlpha(0);

    this.tweens.add({ targets:this.boss, scaleY:1.05, y:305, duration:1500, yoyo:true, repeat:-1 });

    this.particles = this.add.particles(0,0,'spark',{
      speed:{min:100,max:400}, scale:{start:1,end:0}, lifespan:600, gravityY:500, quantity:20, emitting:false
    });

    this.hpText = null;
  }

  showBoss(hp){
    this.boss.setAlpha(1).setY(-100).setScale(1);
    this.tweens.add({ targets:this.boss, y:300, duration:800, ease:'Bounce' });

    if(this.hpText) this.hpText.destroy();
    this.hpText = this.add.text(this.scale.width/2, 180, `HP: ${hp}`, {
      fontSize:'28px', fontStyle:'bold', color:'#ff0000', stroke:'#000', strokeThickness:4
    }).setOrigin(0.5);
  }

  hit(damage){
    this.cameras.main.shake(150, 0.02);
    this.boss.setTint(0xffffff);
    this.time.delayedCall(100, ()=>this.boss.clearTint());

    this.particles.emitParticleAt(this.boss.x, this.boss.y);

    const t = this.add.text(this.boss.x, this.boss.y, `-${damage}`, {
      fontSize:'48px', color:'#fff', stroke:'#f00', strokeThickness:6, fontStyle:'bold'
    }).setOrigin(0.5);

    this.tweens.add({ targets:t, y:this.boss.y-120, alpha:0, duration:1000, ease:'Power1', onComplete:()=>t.destroy() });
  }

  updateHP(hp){ if(this.hpText) this.hpText.setText(`HP: ${hp}`); }

  die(){
    this.tweens.add({ targets:this.boss, scale:0, rotation:5, duration:500 });
    this.particles.emitParticleAt(this.boss.x, this.boss.y, 50);
  }
}

game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game-layer',
  width: window.innerWidth,
  height: window.innerHeight,
  transparent: true,
  scene: [CombatScene]
});

// Start hidden + paused (saves battery)
document.getElementById('game-layer').style.display = 'none';
try { game.scene.getScene('Combat').scene.pause(); } catch(e) {}

/** ======================
 * CAMERA
 * ====================== */
async function openCamera(){
  if (isIOS && isTelegram) {
    logCamDebug("iOS+Telegram → capture fallback.");
    return openCameraFallback();
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("Camera not supported."); return;
  }

  const videoEl = document.getElementById("video");
  try{
    showLoader(true,"OPENING CAMERA...");
    videoEl.setAttribute("playsinline","");
    videoEl.muted = true;

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:"user" } },
      audio:false
    });

    videoEl.srcObject = cameraStream;

    // Wait for metadata then play (helps black-screen cases)
    await new Promise(resolve => { videoEl.onloadedmetadata = () => resolve(); });
    await videoEl.play();

    document.getElementById("camera-box").classList.remove("hidden");
    logCamDebug("Camera started.");
  }catch(err){
    console.error(err);
    alert("Camera denied / blocked.");
    logCamDebug("Err: " + (err && err.name ? err.name : String(err)));
  }finally{
    showLoader(false);
  }
}

function openCameraFallback(){
  const input = document.getElementById("cameraFallback");
  input.onchange = async () => {
    const f = input.files && input.files[0];
    if(!f) return;
    showLoader(true,"UPLOADING...");
    try { await uploadBioBlob(f); }
    finally { showLoader(false); input.value = ""; }
  };
  input.click();
}

function capturePhoto(){
  const v = document.getElementById("video");
  const c = document.getElementById("canvas");
  if(!v.videoWidth || !v.videoHeight){ alert("Wait for camera..."); return; }

  c.width = v.videoWidth;
  c.height = v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);

  c.toBlob(async (b) => {
    if(!b){ alert("Capture failed."); return; }
    stopCamera();
    await uploadBioBlob(b);
  }, "image/jpeg", 0.9);
}

function stopCamera(){
  try{
    const v = document.getElementById("video");
    if(v){ v.pause(); v.srcObject = null; }
  }catch(e){}

  if(cameraStream){
    cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream = null;
  }
  document.getElementById("camera-box").classList.add("hidden");
}

async function uploadBioBlob(fileOrBlob){
  showLoader(true,"UPLOADING BIOMETRICS...");
  const fd = new FormData();
  fd.append("initData", tg ? tg.initData : "debug_mode");
  fd.append("file", fileOrBlob, "face.jpg");

  try{
    const res = await fetch(`${API_URL}/auth/biolock`, { method:"POST", body:fd });
    const d = await res.json().catch(()=>({}));
    if(res.ok && d.status === "success") location.reload();
    else alert(d.msg || "Upload failed");
  }catch(e){
    console.error(e);
    alert("Upload failed");
  }finally{
    showLoader(false);
  }
}

/** ======================
 * INIT / AUTH
 * ====================== */
async function init(){
  showLoader(true,"CONNECTING...");
  try{
    const res = await fetch(`${API_URL}/auth/login`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ initData: tg ? tg.initData : "debug_mode" })
    });
    const data = await res.json();

    if(data.user && data.user.bio_lock_url){
      document.getElementById('hud-ap').innerText = data.user.ap || 0;
      showScreen('screen-feed');
      await loadFeed();
    }else{
      showScreen('screen-entry');
    }
  }catch(e){
    console.error(e);
    showScreen('screen-entry');
  }finally{
    showLoader(false);
  }
}

/** ======================
 * PROFILE & INVENTORY
 * ====================== */
async function loadProfile(){
  showLoader(true,"LOADING PROFILE...");
  try{
    // Use login to fetch fresh user object
    const res = await fetch(`${API_URL}/auth/login`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ initData: tg ? tg.initData : "debug_mode" })
    });
    const data = await res.json();
    const u = data.user || {};

    document.getElementById('prof-img').src = u.bio_lock_url || "";
    document.getElementById('prof-name').innerText = u.username || "AGENT";
    document.getElementById('prof-faction').innerText = u.faction || "UNSORTED";

    const badge = document.getElementById('prof-badge');
    if(u.equipped_item){
      badge.innerText = u.equipped_item;
      badge.classList.remove('hidden');
    }else{
      badge.classList.add('hidden');
    }

    // Inventory endpoint (must exist on backend)
    const invRes = await fetch(`${API_URL}/game/inventory`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ initData: tg ? tg.initData : "debug_mode" })
    });
    const invData = await invRes.json().catch(()=>({}));

    const items = Array.isArray(invData.items) ? invData.items : [];
    const grid = document.getElementById('inventory-list');
    grid.innerHTML = "";

    if(items.length === 0){
      grid.innerHTML = "<div style='grid-column:span 3; color:#555;'>NO LOOT YET</div>";
    }else{
      items.forEach(i => {
        const id = i.item_id || i.id || String(i);
        const equipped = (u.equipped_item && String(u.equipped_item) === String(id)) ? "equipped" : "";
        grid.innerHTML += `<div class="inv-item ${equipped}" onclick="equip('${escapeAttr(id)}')">${escapeHtml(id)}</div>`;
      });
    }

    showScreen('screen-profile');
  }catch(e){
    console.error(e);
    alert("Profile Error");
  }finally{
    showLoader(false);
  }
}

async function equip(itemId){
  showLoader(true,"EQUIPPING...");
  try{
    const res = await fetch(`${API_URL}/game/equip`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ initData: tg ? tg.initData : "debug_mode", item_id: itemId })
    });
    if(!res.ok){
      const d = await res.json().catch(()=>({}));
      throw new Error(d.msg || "Equip failed");
    }
    await loadProfile(); // refresh UI
  }catch(e){
    console.error(e);
    alert("Equip failed");
  }finally{
    showLoader(false);
  }
}

/** ======================
 * FEED
 * ====================== */
async function loadFeed(){
  try{
    const res = await fetch(`${API_URL}/game/feed`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ initData: tg ? tg.initData : "debug_mode" })
    });
    const d = await res.json();
    feed = d.feed || [];
    renderCard();
  }catch(e){
    console.error(e);
    document.getElementById('feed-container').innerHTML = "FEED ERROR";
  }
}

function renderCard(){
  const c = document.getElementById('feed-container');
  if(feed.length === 0){ c.innerHTML = "NO TARGETS"; return; }

  const u = feed[0];
  c.innerHTML =
    `<div class="card">
      <img src="${escapeAttr(u.bio_lock_url || "")}" alt="target">
      <div class="card-overlay">
        <h2 class="glitch" style="margin:0;font-size:1.5rem;">${escapeHtml(u.username || "UNKNOWN")}</h2>
      </div>
    </div>`;
}

async function swipe(dir){
  if(feed.length === 0) return;

  // Ambush chance
  if(Math.random() < 0.2){
    await triggerAmbush();
    return;
  }

  try{
    const t = feed[0];
    const res = await fetch(`${API_URL}/game/swipe`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        initData: tg ? tg.initData : "debug_mode",
        target_id: t.user_id,
        direction: dir
      })
    });
    const d = await res.json().catch(()=>({}));

    // Prefer server truth if provided
    const apEl = document.getElementById('hud-ap');
    if(typeof d.new_ap === "number") apEl.innerText = d.new_ap;
    else apEl.innerText = (parseInt(apEl.innerText) || 0) + 1;

    feed.shift();
    renderCard();
  }catch(e){
    console.error(e);
  }
}

/** ======================
 * COMBAT
 * ====================== */
async function triggerAmbush(){
  showScreen('screen-combat');
  const scene = game.scene.getScene('Combat');

  try{
    const res = await fetch(`${API_URL}/game/combat/info`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ initData: tg ? tg.initData : "debug_mode" })
    });
    const d = await res.json().catch(()=>({}));

    const hp = (d && d.boss && typeof d.boss.hp === "number") ? d.boss.hp : 25;
    currentBossHP = hp;

    scene.showBoss(currentBossHP);
  }catch(e){
    console.error(e);
    currentBossHP = 25;
    scene.showBoss(currentBossHP);
  }
}

async function gameCombatAction(act){
  const scene = game.scene.getScene('Combat');

  try{
    const res = await fetch(`${API_URL}/game/combat/turn`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        initData: tg ? tg.initData : "debug_mode",
        action: act,
        boss_hp_current: currentBossHP
      })
    });

    const d = await res.json().catch(()=>({}));

    const nextHP = (typeof d.new_boss_hp === "number") ? d.new_boss_hp : currentBossHP;

    if(act === "ATTACK"){
      const dmg = Math.max(0, currentBossHP - nextHP);
      if(dmg > 0) scene.hit(dmg);
    }

    if(d.status === "VICTORY"){
      scene.die();
      setTimeout(() => {
        alert(`VICTORY! Loot: ${d.loot || "???"}`);
        showScreen('screen-feed');
        loadFeed();
      }, 1200);
      return;
    }

    currentBossHP = nextHP;
    scene.updateHP(currentBossHP);
  }catch(e){
    console.error(e);
    // If backend not ready, do nothing (or add offline prototype here)
  }
}

function exitCombat(){
  showScreen('screen-feed');
}

/** ======================
 * RESET
 * ====================== */
async function nukeIdentity(){
  if(!confirm("RESET IDENTITY?")) return;
  showLoader(true,"RESETTING...");
  try{
    await fetch(`${API_URL}/auth/reset`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ initData: tg ? tg.initData : "debug_mode" })
    });
    location.reload();
  }catch(e){
    console.error(e);
    alert("Reset failed");
  }finally{
    showLoader(false);
  }
}

/** ======================
 * UI / UTILS
 * ====================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');

  // Toggle Phaser layer + pause/resume (battery)
  const gl = document.getElementById('game-layer');
  const scene = game.scene.getScene('Combat');

  if(id === 'screen-combat'){
    gl.style.display = 'block';
    scene.scene.resume();
  }else{
    gl.style.display = 'none';
    scene.scene.pause();
  }
}

function showLoader(v, msg=""){
  const l = document.getElementById('loader');
  if(v){
    l.classList.remove('hidden');
    document.getElementById('loader-msg').innerText = msg;
  }else{
    l.classList.add('hidden');
  }
}

function logCamDebug(msg){
  const el = document.getElementById("cam-debug");
  if(el) el.textContent = msg;
  console.log(msg);
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(str){
  // safe for putting inside attributes like src=""
  return escapeHtml(str).replaceAll("`","&#096;");
}

/** ======================
 * START
 * ====================== */
init();
</script>
</body>
</html>
