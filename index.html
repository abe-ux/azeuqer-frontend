<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>AZEUQER — Intro · Profile · Scan</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#f7fbff;
  --card:#ffffff;
  --ink:#0b1324;
  --muted:#5c6b86;

  --cyan:#00d9ff;
  --violet:#7c3aed;
  --pink:#ff2bd6;
  --gold:#ffcc33;
  --red:#ff2d2d;
  --green:#18f59c;

  --line:#dbe7ff;
  --radius:22px;
  --shadow:0 14px 32px rgba(10,20,40,.10);

  --marqueeH:56px;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(900px 600px at 20% -10%, #fff 0%, var(--bg) 40%),
    radial-gradient(700px 700px at 80% 90%, rgba(124,58,237,.10), transparent 60%);
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
  color:var(--ink);
  overflow:hidden;
}

/* ===== APP ROOT ===== */
.app{
  position:fixed;
  inset:0;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ===== MARQUEE ===== */
.marquee{
  position:fixed;
  top:env(safe-area-inset-top);
  left:0; right:0;
  z-index:90;
  background:rgba(255,255,255,.8);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.marquee .track{
  display:flex;
  gap:40px;
  padding:10px 14px;
  white-space:nowrap;
  font-weight:900;
  animation:scroll 16s linear infinite;
}
@keyframes scroll{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}
.pill{
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 12px;
  background:#fff;
}

/* ===== ROUTER AREA ===== */
.screens{
  position:absolute;
  inset:0;
  padding-top:calc(var(--marqueeH) + 8px);
}
.screen{
  position:absolute;
  inset:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:14px;
  display:none;
}
.screen.active{display:block}

.wrap{max-width:520px;margin:0 auto;padding-bottom:120px}

/* ===== COMMON UI ===== */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.card-inner{padding:18px}

h1,h2,h3{margin:0}
.muted{color:var(--muted);font-weight:700}

.btn{
  width:100%;
  border:0;
  border-radius:16px;
  padding:14px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),var(--violet));
  color:#fff;
}
.btn.secondary{
  background:#fff;
  color:var(--ink);
  border:1px solid var(--line);
}
.row{display:flex;gap:10px;margin-top:10px}

/* ===== SCREEN 1 — INTRO ===== */
.introText{
  font-size:28px;
  font-weight:1000;
  text-align:center;
  letter-spacing:-.02em;
  margin:24px 0;
}
.glitch{
  text-shadow:2px 0 var(--pink),-2px 0 var(--cyan);
}

/* ===== SCREEN 2 — PROFILE ===== */
.statGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}
.stat{
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
  background:#fff;
}
.stat .k{font-size:12px;color:var(--muted);font-weight:900}
.stat .v{font-size:18px;font-weight:1000;margin-top:6px}

/* ===== SCREEN 3 — SCAN / SWIPE ===== */
.scanCard{
  text-align:center;
}
.scanImg{
  width:100%;
  aspect-ratio:3/4;
  border-radius:20px;
  border:1px solid var(--line);
  background:linear-gradient(135deg,#e0f7ff,#ede9fe);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:1000;
}
.scanActions{
  display:flex;
  gap:14px;
  margin-top:14px;
}
.voteBtn{
  flex:1;
  border-radius:18px;
  padding:16px;
  font-size:18px;
  font-weight:1000;
  cursor:pointer;
  border:0;
}
.voteBtn.light{background:var(--gold)}
.voteBtn.spite{background:var(--red);color:#fff}

/* ===== BOTTOM NAV ===== */
.footer{
  position:fixed;
  bottom:env(safe-area-inset-bottom);
  left:0;right:0;
  padding:10px;
}
.footer .bar{
  display:flex;
  gap:10px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(10px);
  border:1px solid var(--line);
  border-radius:20px;
  padding:10px;
}
.navbtn{
  flex:1;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px;
  background:#fff;
  font-weight:900;
}
</style>
</head>

<body>
<div class="app">

<!-- MARQUEE -->
<div class="marquee" id="marquee">
  <div class="track">
    <span class="pill">SPONSORS · DGLITCH · PARTNERS · COMING SOON</span>
    <span class="pill">SPONSORS · DGLITCH · PARTNERS · COMING SOON</span>
  </div>
</div>

<!-- ROUTER -->
<div class="screens">

<!-- SCREEN 1 -->
<div class="screen active" id="intro">
  <div class="wrap">
    <div class="card">
      <div class="card-inner">
        <div class="introText">You are invisible.</div>
        <div class="introText glitch">WAKE UP.</div>
        <button class="btn" onclick="go('profile')">ENTER</button>
      </div>
    </div>
  </div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="profile">
  <div class="wrap">
    <div class="card">
      <div class="card-inner">
        <h2>Your Profile</h2>
        <div class="statGrid">
          <div class="stat"><div class="k">Energy</div><div class="v" id="energy">30 / 30</div></div>
          <div class="stat"><div class="k">Scans Today</div><div class="v" id="scans">0 / 20</div></div>
          <div class="stat"><div class="k">AP</div><div class="v" id="ap">0</div></div>
          <div class="stat"><div class="k">Faction</div><div class="v">UNSORTED</div></div>
        </div>
        <div class="row">
          <button class="btn secondary" onclick="go('intro')">Back</button>
          <button class="btn" onclick="go('scan')">Start Scanning</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="scan">
  <div class="wrap">
    <div class="card scanCard">
      <div class="card-inner">
        <div class="scanImg" id="scanImg">USER</div>
        <div class="scanActions">
          <button class="voteBtn spite" onclick="vote('spite')">SPITE</button>
          <button class="voteBtn light" onclick="vote('light')">LIGHT</button>
        </div>
        <div class="muted" id="scanInfo" style="margin-top:10px">
          Scan 1 of 10 · Energy OK
        </div>
        <div class="row">
          <button class="btn secondary" onclick="go('profile')">Profile</button>
        </div>
      </div>
    </div>
  </div>
</div>

</div>

<!-- NAV -->
<div class="footer">
  <div class="bar">
    <button class="navbtn" onclick="go('intro')">Intro</button>
    <button class="navbtn" onclick="go('profile')">Profile</button>
    <button class="navbtn" onclick="go('scan')">Scan</button>
  </div>
</div>

</div>

<script>
/* Telegram */
if(window.Telegram?.WebApp){
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

/* Marquee height fix */
function fixMarquee(){
  const h=document.getElementById('marquee').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--marqueeH',h+'px');
}
setTimeout(fixMarquee,50);
window.addEventListener('resize',fixMarquee);

/* Router */
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* Scan Logic (Simulated) */
let scans=0;
let energy=30;
let ap=0;
let bossRoll=Math.floor(Math.random()*10)+11;

function vote(type){
  scans++;
  ap++;
  if(scans>20){ energy--; }
  document.getElementById('scans').textContent=`${scans} / 20`;
  document.getElementById('energy').textContent=`${energy} / 30`;
  document.getElementById('ap').textContent=ap;

  if(scans===bossRoll){
    document.getElementById('scanInfo').textContent="⚠ BOSS SIGNAL DETECTED";
  }else{
    document.getElementById('scanInfo').textContent=
      `Scan ${Math.min(scans,10)} of 10 · ${scans>20?'Energy Used':'Free Scan'}`;
  }
}
</script>
</body>
</html>
