<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>AZEUQER: TITANIUM (FEED + BOSS)</title>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root { --bg:#050505; --neon:#00ffcc; --pink:#ff00ff; --red:#ff3333; }
  body { background:var(--bg); color:#fff; font-family:'Courier New', monospace; margin:0; overflow:hidden; }
  .hidden{display:none!important;}

  #game-layer { position:fixed; inset:0; z-index:1; display:none; }
  #ui-layer { position:fixed; inset:0; z-index:10; pointer-events:none; }

  .screen {
    pointer-events:auto; padding:18px; text-align:center;
    height:100vh; overflow-y:auto; box-sizing:border-box;
    background:rgba(0,0,0,0.86);
  }
  .screen.transparent { background:none; }

  .scanlines {
    position:fixed; inset:0; pointer-events:none; z-index:50;
    background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%),
                linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
    background-size:100% 2px, 3px 100%;
  }
  .glitch { animation:shake 2s infinite; color:var(--neon); font-size:2rem; font-weight:bold; text-shadow: 2px 0 var(--pink); }
  @keyframes shake{0%{transform:translate(0,0);}2%{transform:translate(1px,0);}4%{transform:translate(0,0);} }

  .btn{
    width:100%; padding:14px; background:#111;
    border:1px solid var(--neon); color:var(--neon);
    margin-top:12px; font-weight:bold; cursor:pointer;
    pointer-events:auto;
  }
  .btn:active{ transform:scale(0.98); background:var(--neon); color:#000; }
  .btn-red{ border-color:var(--red); color:var(--red); }
  .btn-red:active{ background:var(--red); color:#000; }
  .btn-small{ width:auto; font-size:0.8rem; padding:6px 10px; margin:0; }

  .card{
    width:min(340px, 92vw); height:min(440px, 62vh);
    margin:18px auto; border:1px solid #333;
    position:relative; background:#000; overflow:hidden;
    box-shadow:0 0 20px rgba(0,255,204,0.10);
  }
  .card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .card-overlay{
    position:absolute; bottom:0; width:100%;
    background:linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.0));
    padding:16px; box-sizing:border-box; text-align:left;
  }
  .hud {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; padding-bottom:10px; border-bottom:1px solid #333;
    gap:10px;
  }
  .pill {
    border:1px solid #333; padding:8px 10px; border-radius:12px;
    background:rgba(255,255,255,0.04);
  }

  #loader{
    position:fixed; inset:0; background:#000; z-index:100;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
  }

  /* Boss UI */
  .boss-box{
    width:min(360px, 94vw);
    margin:10px auto 0;
    border:1px solid rgba(255,255,255,0.12);
    padding:12px;
    background:rgba(0,0,0,0.35);
    border-radius:14px;
  }
  .bar{
    width:100%; height:12px; background:rgba(255,255,255,0.08);
    border-radius:999px; overflow:hidden; border:1px solid rgba(255,255,255,0.10);
    margin-top:8px;
  }
  .bar > div{
    height:100%; width:100%;
    background:linear-gradient(90deg, rgba(255,51,51,0.9), rgba(255,0,255,0.35));
    border-radius:999px;
    transition:width 0.18s;
  }
</style>
</head>

<body>
<div class="scanlines"></div>

<div id="loader" class="hidden">
  <div class="glitch">CONNECTING...</div>
  <div id="loader-msg" style="color:#666;font-size:0.85rem;margin-top:10px;"></div>
</div>

<div id="game-layer"></div>

<div id="ui-layer">

  <!-- FEED -->
  <div id="screen-feed" class="screen">
    <div class="hud">
      <div class="pill" style="color:var(--neon); font-weight:bold;">
        AP: <span id="hud-ap">0</span>
      </div>
      <div class="pill" style="color:#fff;">
        Energy: <span id="hud-energy">0</span>/<span id="hud-energy-max">30</span>
      </div>
      <div class="pill" style="color:#aaa;">
        Swipes: <span id="hud-swipes">0</span>
      </div>
    </div>

    <div id="feed-container"></div>

    <div style="position:fixed; bottom:28px; width:92%; left:4%; display:flex; gap:12px;">
      <button class="btn btn-red" onclick="swipe('SPITE')">💀 SPITE</button>
      <button class="btn" onclick="swipe('LIGHT')">⚡ LIGHT</button>
    </div>

    <div style="margin-top:12px;color:#666;font-size:0.85rem;" id="status">SYSTEM READY</div>
  </div>

  <!-- COMBAT -->
  <div id="screen-combat" class="screen hidden transparent">
    <h1 class="glitch" style="color:var(--red); margin-top:18px;">AMBUSH</h1>

    <div class="boss-box">
      <div style="display:flex; align-items:center; gap:12px;">
        <img id="boss-img" src="" alt="boss" style="width:84px;height:84px;border:1px solid rgba(255,255,255,0.12);border-radius:12px;object-fit:cover;background:#000;">
        <div style="flex:1; text-align:left;">
          <div id="boss-name" style="font-weight:bold; letter-spacing:0.6px;">BOSS</div>
          <div style="color:#aaa; font-size:0.9rem;">HP: <span id="boss-hp">0</span>/<span id="boss-hp-max">0</span></div>
          <div class="bar"><div id="boss-bar"></div></div>
        </div>
      </div>

      <div id="combat-log" style="margin-top:10px;color:#aaa;font-size:0.9rem;min-height:22px;"></div>
    </div>

    <div style="margin-top:18px; display:flex; gap:10px; justify-content:center;">
      <button class="btn btn-red" style="max-width:220px;" onclick="combatAction('ATTACK')">⚔ ATTACK</button>
      <button class="btn" style="max-width:220px;border-color:#fff;color:#fff;" onclick="combatAction('POTION_HP')">💉 HEAL</button>
    </div>

    <button class="btn btn-small" style="margin-top:12px;border-color:#777;color:#777;" onclick="exitCombat()">↩ BACK</button>
  </div>

</div>

<script>
/** ======================
 * CONFIG
 * ====================== */
const API_URL = "https://azeuqer-backend.onrender.com"; // your Render backend
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
try { if (tg) { tg.ready(); tg.expand(); } } catch(e){}

/** ======================
 * PHASER (juice layer)
 * ====================== */
let game;
class CombatScene extends Phaser.Scene {
  constructor(){ super({ key:'Combat' }); }
  preload(){
    const g = this.make.graphics({x:0,y:0,add:false});
    g.clear(); g.fillStyle(0xffffff, 1); g.fillCircle(4,4,4); g.generateTexture('spark', 8, 8);
  }
  create(){
    this.cameras.main.setBackgroundColor('rgba(0,0,0,0)');
    this.particles = this.add.particles(0,0,'spark',{ speed:{min:120,max:420}, scale:{start:1,end:0}, lifespan:650, gravityY:520, quantity:20, emitting:false });
  }
  hit(x,y){
    this.cameras.main.shake(120, 0.018);
    this.particles.emitParticleAt(x, y);
  }
}
game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game-layer',
  width: window.innerWidth,
  height: window.innerHeight,
  transparent: true,
  scene: [CombatScene],
});

/** ======================
 * STATE
 * ====================== */
let user = null;
let feed = [];
let currentTarget = null;

let boss = { id: 0, name: "", hp: 0, hpMax: 0, img: "" };

/** ======================
 * HELPERS
 * ====================== */
function showLoader(v,msg=""){
  const l=document.getElementById('loader');
  if(v){ l.classList.remove('hidden'); document.getElementById('loader-msg').innerText=msg; }
  else{ l.classList.add('hidden'); }
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');

  const gl = document.getElementById('game-layer');
  if(id==='screen-combat'){
    gl.style.display='block';
    try { game.scene.getScene('Combat').scene.resume(); } catch(e){}
  } else {
    gl.style.display='none';
    try { game.scene.getScene('Combat').scene.pause(); } catch(e){}
  }
}

function fullUrlMaybe(url){
  if(!url) return url;
  if(url.startsWith("http://") || url.startsWith("https://")) return url;
  if(url.startsWith("/")) return API_URL + url;      // IMPORTANT for Vercel
  return url;
}

function setStatus(t){ document.getElementById("status").innerText = t; }

function hudUpdate(extra = {}){
  const ap = (extra.ap !== undefined) ? extra.ap : (user?.ap || 0);
  const energy = (extra.energy !== undefined) ? extra.energy : (user?.energy || 0);
  const energyMax = (extra.energy_max !== undefined) ? extra.energy_max : (user?.energy_max || 30);
  const swipes = (extra.swipes_today !== undefined) ? extra.swipes_today : (user?.swipes_today || 0);

  document.getElementById("hud-ap").innerText = ap;
  document.getElementById("hud-energy").innerText = energy;
  document.getElementById("hud-energy-max").innerText = energyMax;
  document.getElementById("hud-swipes").innerText = swipes;
}

function renderCard(){
  const c = document.getElementById("feed-container");
  if(feed.length === 0){
    c.innerHTML = `<div style="margin-top:26px;color:#777;">NO TARGETS — reloading…</div>`;
    loadFeed(true);
    return;
  }
  currentTarget = feed[0];
  const img = fullUrlMaybe(currentTarget.bio_lock_url);
  const name = escapeHtml(currentTarget.username || "CITIZEN");

  c.innerHTML = `
    <div class="card" id="card">
      <img src="${img}" alt="target">
      <div class="card-overlay">
        <div class="glitch" style="font-size:1.35rem;margin:0;">${name}</div>
        <div style="color:#bbb;font-size:0.85rem;margin-top:6px;">ID: ${currentTarget.user_id}</div>
        <div style="color:#666;font-size:0.78rem;margin-top:6px;">Swipe to gain AP • Boss triggers every 10th swipe</div>
      </div>
    </div>
  `;
}

function escapeHtml(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/** ======================
 * API
 * ====================== */
async function apiPost(path, body){
  const initData = (tg && tg.initData) ? tg.initData : "debug_mode";
  const res = await fetch(API_URL + path, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ initData, ...body })
  });
  const data = await res.json().catch(()=> ({}));
  if(!res.ok) throw new Error(data.msg || ("HTTP " + res.status));
  return data;
}

/** ======================
 * INIT
 * ====================== */
async function init(){
  showLoader(true, "CONNECTING…");
  try{
    const data = await apiPost("/auth/login", {});
    if(data.status !== "ok") throw new Error(data.msg || "LOGIN_FAIL");
    user = data.user;
    hudUpdate({
      ap: user.ap || 0,
      energy: user.energy || 0,
      energy_max: 30,
      swipes_today: user.swipes_today || 0
    });
    await loadFeed(false);
    setStatus("CONNECTED • FEED ARMED");
  }catch(e){
    setStatus("BACKEND ERROR: " + e.message);
  }finally{
    showLoader(false);
  }
}

async function loadFeed(silent){
  if(!silent) showLoader(true, "LOADING FEED…");
  try{
    const d = await apiPost("/game/feed", {});
    feed = d.feed || [];
    renderCard();
  }catch(e){
    setStatus("FEED ERROR: " + e.message);
  }finally{
    if(!silent) showLoader(false);
  }
}

/** ======================
 * SWIPE (IMPORTANT: boss triggers from backend ambush flag)
 * ====================== */
async function swipe(dir){
  if(!currentTarget) return;
  const card = document.getElementById("card");
  if(card){
    const x = dir === "LIGHT" ? 240 : -240;
    const rot = dir === "LIGHT" ? 18 : -18;
    card.style.transition = "transform 0.24s ease-out, opacity 0.24s ease-out";
    card.style.transform = `translateX(${x}px) rotate(${rot}deg)`;
    card.style.opacity = "0.2";
  }

  try{
    const d = await apiPost("/game/swipe", { target_id: currentTarget.user_id, direction: dir });

    // Update HUD from backend response (AP/energy/swipes)
    hudUpdate({
      ap: d.new_ap,
      energy: d.new_energy,
      energy_max: d.energy_max || 30,
      swipes_today: d.swipes_today
    });

    // Pop next card
    feed.shift();
    renderCard();

    // ✅ Guaranteed boss trigger every 10th swipe:
    if(d.ambush){
      setStatus("AMBUSH TRIGGERED — ENTERING COMBAT");
      await enterCombat();
    } else {
      setStatus(`+1 AP • ${dir} cast`);
    }
  }catch(e){
    setStatus("SWIPE ERROR: " + e.message);
  }
}

/** ======================
 * COMBAT
 * ====================== */
async function enterCombat(){
  showLoader(true, "SPAWNING BOSS…");
  try{
    const info = await apiPost("/game/combat/info", {});
    const b = info.boss;
    boss.id = b.id;
    boss.name = b.name;
    boss.hp = b.hp;
    boss.hpMax = b.hp;
    boss.img = fullUrlMaybe(b.img);

    document.getElementById("boss-img").src = boss.img;
    document.getElementById("boss-name").innerText = boss.name;
    document.getElementById("boss-hp").innerText = boss.hp;
    document.getElementById("boss-hp-max").innerText = boss.hpMax;
    document.getElementById("boss-bar").style.width = "100%";
    document.getElementById("combat-log").innerText = "The entity stares back…";

    // Phaser burst
    try { game.scene.getScene('Combat').hit(window.innerWidth/2, 280); } catch(e){}

    showScreen("screen-combat");
  }catch(e){
    setStatus("COMBAT INFO ERROR: " + e.message);
  }finally{
    showLoader(false);
  }
}

async function combatAction(action){
  if(boss.hp <= 0) return;

  showLoader(true, "EXECUTING…");
  try{
    const d = await apiPost("/game/combat/turn", {
      action,
      boss_hp_current: boss.hp,
      boss_id: boss.id
    });

    if(d.status === "VICTORY"){
      boss.hp = 0;
      document.getElementById("boss-hp").innerText = "0";
      document.getElementById("boss-bar").style.width = "0%";
      document.getElementById("combat-log").innerText = `VICTORY • Loot: ${d.loot}`;

      try { game.scene.getScene('Combat').hit(window.innerWidth/2, 280); } catch(e){}

      setTimeout(async()=>{
        showScreen("screen-feed");
        setStatus("LOOT ACQUIRED • FEED RESUMED");
      }, 900);
      return;
    }

    boss.hp = d.new_boss_hp;
    document.getElementById("boss-hp").innerText = boss.hp;
    const pct = Math.max(0, Math.min(100, Math.round((boss.hp / boss.hpMax) * 100)));
    document.getElementById("boss-bar").style.width = pct + "%";

    document.getElementById("combat-log").innerText =
      (action === "ATTACK")
      ? `You strike • -${d.damage_done || "?"} • Boss hits back`
      : `You stabilize • Boss watches`;

    // Phaser hit burst
    try { game.scene.getScene('Combat').hit(window.innerWidth/2, 280); } catch(e){}
  }catch(e){
    document.getElementById("combat-log").innerText = "TURN ERROR: " + e.message;
  }finally{
    showLoader(false);
  }
}

function exitCombat(){
  showScreen("screen-feed");
  setStatus("Combat exited.");
}

/** ======================
 * START
 * ====================== */
init();
</script>
</body>
</html>
